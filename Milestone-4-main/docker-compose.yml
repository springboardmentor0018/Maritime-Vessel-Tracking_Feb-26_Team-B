# ─── Vessel Tracker — Docker Compose ─────────────────────────────────────────
# Development and production orchestration.

version: '3.9'

services:
  web:
    build: .
    container_name: vessel-tracker-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
      - app_logs:/app/logs
      - static_files:/app/staticfiles
    environment:
      - DJANGO_SETTINGS_MODULE=vessel_tracker.settings
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn vessel_tracker.wsgi:application
             --bind 0.0.0.0:8000
             --workers 3
             --timeout 120
             --access-logfile -
             --error-logfile -"

volumes:
  sqlite_data:
    driver: local
  app_logs:
    driver: local
  static_files:
    driver: local
